name: Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # Proves that a database created by an older Filadex still upgrades cleanly:
  # every row preserved, and the same schema a fresh install gets. This is what
  # keeps migrations/legacy honest - those scripts are frozen and are otherwise
  # only exercised on a real upgrade, where finding out they broke is too late.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run db:verify-upgrade
